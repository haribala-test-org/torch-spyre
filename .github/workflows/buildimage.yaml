# https://docs.docker.com/build/ci/github-actions/
# https://github.com/marketplace/actions/build-and-push-docker-images

name: buildimages

# on:
#   push: null

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]


jobs:
  docker:
    # runs-on: ubuntu-latest
    runs-on: hb-test-org-runners-2
    steps:
      - uses: actions/checkout@v6
      - name: Set up Docker
        uses: docker/setup-docker-action@v5
      - name: test
        run: |
          ls -al
          pwd
          IMAGE=foo
          DOCKER_CONTEXT=testcontainerimages
          ls -la ${DOCKER_CONTEXT}
          docker ps -a
          echo DEBUG0
          echo docker build -t ${IMAGE} -f ${DOCKER_CONTEXT}/Dockerfile ${DOCKER_CONTEXT}
          docker build -t ${IMAGE} -f ${DOCKER_CONTEXT}/Dockerfile ${DOCKER_CONTEXT}
          echo DEBUG1
          docker images
          echo DEBUG2
          echo docker run --rm --entrypoint bash ${IMAGE} -c echo foobar1234
          docker run --rm --entrypoint bash ${IMAGE} -c echo foobar1234
          echo DEBUG3

