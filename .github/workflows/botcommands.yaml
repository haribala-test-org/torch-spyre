name: Bot Commands

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  # issues:
  #   types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  create-pr-comment:
    if: |
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, 'bot:test')) ||
      (github.event_name == 'pull_request_review_comment' && startsWith(github.event.comment.body, 'bot:test')) ||
      (github.event_name == 'pull_request_review' && startsWith(github.event.review.body, 'bot:test'))
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v8
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          # https://github.com/actions/github-script?tab=readme-ov-file#comment-on-an-issue
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 Launching the tests!',
            });

  call-another-workflow:
    needs: create-pr-comment
    # uses: {owner}/{repo}/.github/workflows/{filename}@{ref} for reusable workflows in public and private repositories.
    # uses: ./.github/workflows/{filename} for reusable workflows in the same repository.
    # uses: octo-org/example-repo/.github/workflows/reusable-workflow.yml@main
    uses: ./.github/workflows/runtests.yaml
    permissions:
      checks: write
      contents: read

