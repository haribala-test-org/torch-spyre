name: Bot Commands

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  # issues:
  #   types: [opened, assigned]
  pull_request_review:
    types: [submitted]

# test 1

jobs:
  create-pr-comment:
    if: |
      (
        github.event_name == 'issue_comment' &&
        startsWith(github.event.comment.body, 'bot:test') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      ) ||
      (
        github.event_name == 'pull_request_review_comment' &&
        startsWith(github.event.comment.body, 'bot:test') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      ) ||
      (
        github.event_name == 'pull_request_review' &&
        startsWith(github.event.review.body, 'bot:test') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)
      )
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v8
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          # https://github.com/actions/github-script?tab=readme-ov-file#comment-on-an-issue
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 Launching the tests!',
            });

  call-another-workflow:
    needs: create-pr-comment
    # https://docs.github.com/en/actions/how-tos/reuse-automations/reuse-workflows
    uses: ./.github/workflows/runtests.yaml
    permissions:
      checks: write
      contents: read
