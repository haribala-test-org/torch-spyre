name: Bot Commands

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  # issues:
  #   types: [opened, assigned]
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  resolve-pr:
    if: |
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        startsWith(github.event.comment.body, 'bot:test') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      ) ||
      (
        github.event_name == 'pull_request_review_comment' &&
        startsWith(github.event.comment.body, 'bot:test') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      ) ||
      (
        github.event_name == 'pull_request_review' &&
        startsWith(github.event.review.body, 'bot:test') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)
      )
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    outputs:
      head_sha: ${{ steps.pr-info.outputs.head_sha }}
      pr_ref: ${{ steps.pr-info.outputs.pr_ref }}
    steps:
      - name: Get PR head SHA
        id: pr-info
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.issue?.number ?? context.payload.pull_request?.number;
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            core.setOutput('head_sha', pr.data.head.sha);
            core.setOutput('pr_ref', `refs/pull/${prNumber}/head`);
      - name: Comment on PR
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.issue?.number ?? context.payload.pull_request?.number;
            await github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 Launching the tests!',
            });

  call-another-workflow:
    needs: resolve-pr
    # https://docs.github.com/en/actions/how-tos/reuse-automations/reuse-workflows
    uses: ./.github/workflows/runtests.yaml
    with:
      checkout_ref: ${{ needs.resolve-pr.outputs.pr_ref }}
      head_sha: ${{ needs.resolve-pr.outputs.head_sha }}
    permissions:
      contents: read
      statuses: write
