name: Bot Commands

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  # issues:
  #   types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  call-another-workflow:
    # uses: {owner}/{repo}/.github/workflows/{filename}@{ref} for reusable workflows in public and private repositories.
    # uses: ./.github/workflows/{filename} for reusable workflows in the same repository.
    # uses: octo-org/example-repo/.github/workflows/reusable-workflow.yml@main
    if: |
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, 'bot:test')) ||
      (github.event_name == 'pull_request_review_comment' && startsWith(github.event.comment.body, 'bot:test')) ||
      (github.event_name == 'pull_request_review' && startsWith(github.event.review.body, 'bot:test'))
    uses: ./.github/workflows/runtests.yaml
    permissions:
      checks: write
      contents: read

